# =============================================================================
# NordicOS Kitty — Puesto de mando vikingo moderno
# =============================================================================

# --- Ventana ---
# Transparência ligera (0.92 = 92% opaco)
background_opacity 0.92

# --- Cursor ---
cursor_shape block
cursor_stop_blinking_after 0

# --- Colores del terminal (16 colores ANSI) ---

# --- Tipografía ---
# Nerd Font + fallback
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
adjust_line_height 1
adjust_column_width 1

# --- Scrollback ---
scrollback_lines 10000

# --- Comportamiento ---
confirm_os_window_close 0
strip_trailing_spaces always
# enabled_deprecation_notifications false

# --- Barras de título ---
window_title_template {title}

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0

# --- Ratón ---
url_style double
open_url_with default

# Color palette moved to theme.conf (auto-managed by palette/build.js)
include theme.conf
